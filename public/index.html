<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bennowo</title>
        <meta name="description" content="Bennowo, a hobby developer who loves to code. Projects, apps and more." />
        <link rel="canonical" href="https://www.bennowo.de/" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235f7a52'/%3E%3Ctext x='50' y='70' font-size='60' font-family='system-ui,sans-serif' font-weight='800' text-anchor='middle' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <script src="scripts/theme.js"></script>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
        <meta name="theme-color" content="#f6f7f2" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1a1c2c" media="(prefers-color-scheme: dark)" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Bennowo" />
    </head>
    <body onload="typeWriter()">
        <!-- Menu Bar -->
        <nav>
            <ul>
                <li><a href="/" aria-current="page">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/projects">Projects</a></li>
            </ul>
        </nav>

        <main class="hero">
            <div class="hero-card">
                <img class="avatar-stamp" src="assets/profile.png" alt="Profile photo">
                <div class="hero-text">
                    <p class="eyebrow">Hello, I'm</p>
                    <h1>Bennowo</h1>
                    <p id="about-p"></p>
                    <div
                        class="socials-container"
                        id="socials-container"
                    ></div>
                </div>
            </div>
        </main>

        <footer>© 2026 Bennowo · <a href="https://github.com/BennoCrafter" target="_blank" rel="noopener noreferrer">GitHub</a></footer>

        <script src="scripts/socials.js"></script>
        <script src="scripts/sw-register.js"></script>
        <script>
            var i = 0;
            var txt = "a hobby developer who loves to code.";
            var speed = 25;

            function typeWriter() {
                if (i < txt.length) {
                    document.getElementById("about-p").innerHTML +=
                        txt.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
        </script>
    </body>
</html>
