    <body>
        <!-- Menu Bar -->
        <nav>
            <ul>
                <li><a href="/" aria-current="page">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/projects">Projects</a></li>
            </ul>
        </nav>

        <main class="hero">
            <div class="stage">
                <p class="hi"><img src="assets/profile.svg" alt="Profile photo" /> hey, i'm</p>
                <h1 class="name">benno</h1>
                <p class="builds">a hobby developer who <strong id="thing"></strong></p>
                <div class="socials-container" id="socials-container"></div>
            </div>
        </main>

        <footer>© 2026 Bennowo · <a href="https://github.com/BennoCrafter" target="_blank" rel="noopener noreferrer">github</a></footer>

        <script src="scripts/socials.js"></script>
        <script src="scripts/hop.js"></script>
        <script src="scripts/sw-register.js"></script>
        <script>
            // Things from the About page, typed out one after another
            const things = ["builds iOS apps.", "builds python tools.", "contributes to open source."];
            const out = document.getElementById("thing");
            const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
            let t = 0;
            let c = 0;
            let deleting = false;

            function tick() {
                const word = things[t];
                c += deleting ? -1 : 1;
                out.textContent = word.slice(0, c);
                if (!deleting && c === word.length) {
                    deleting = true;
                    return setTimeout(tick, 1800);
                }
                if (deleting && c === 0) {
                    deleting = false;
                    t = (t + 1) % things.length;
                }
                setTimeout(tick, deleting ? 25 : 55);
            }

            if (still) out.textContent = things.join(" ");
            else tick();
        </script>
    </body>
</html>
